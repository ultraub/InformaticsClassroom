{% extends "base.html" %}
{% block title %}Create Quiz{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Create a New Quiz</h2>
    <form id="create-quiz-form" method="POST">
        <div class="mb-3">
            <label for="quiz_title" class="form-label">Quiz Title</label>
            <input type="text" id="quiz_title" name="quiz_title" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description" name="description" class="form-control" rows="3" required></textarea>
        </div>
        <div class="mb-3">
            <label for="class" class="form-label">Class</label>
            <input type="text" id="class" name="class" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="module" class="form-label">Module</label>
            <input type="number" id="module" name="module" class="form-control" required>
        </div>
        <div id="questions-container">
            <h4>Questions</h4>
            <button type="button" id="add-question-btn" class="btn btn-secondary mb-3">Add Question</button>
        </div>
        <button type="submit" class="btn btn-primary">Create Quiz</button>
    </form>
</div>

<script>
    const questionsContainer = document.getElementById("questions-container");
    const addQuestionBtn = document.getElementById("add-question-btn");
    let questionCount = 0;

    addQuestionBtn.addEventListener("click", () => {
        questionCount++;
        const questionDiv = document.createElement("div");
        questionDiv.className = "question mb-3";
        questionDiv.innerHTML = `
            <h5>Question ${questionCount}</h5>
            <input type="hidden" name="questions[${questionCount}][question_num]" value="${questionCount}">
            <label for="answer_${questionCount}" class="form-label">Correct Answer</label>
            <input type="text" id="answer_${questionCount}" name="questions[${questionCount}][correct_answer]" class="form-control">
            <div class="form-check">
                <input class="form-check-input" type="checkbox" id="open_${questionCount}" name="questions[${questionCount}][open]" value="True">
                <label class="form-check-label" for="open_${questionCount}">Open-Ended</label>
            </div>
        `;
        questionsContainer.appendChild(questionDiv);
    });

    document.getElementById("create-quiz-form").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const formData = new FormData(this);
        const questions = [];
        
        formData.forEach((value, key) => {
            const match = key.match(/^questions\[(\d+)\]\[(\w+)\]$/);
            if (match) {
                const index = parseInt(match[1], 10);
                const field = match[2];
                questions[index] = questions[index] || {};
                questions[index][field] = field === 'question_num' ? parseInt(value, 10) : value;
            }
        });

        const jsonData = {
            quiz_title: formData.get('quiz_title'),
            description: formData.get('description'),
            class: formData.get('class'),
            module: parseInt(formData.get('module'), 10),
            id: `${formData.get('class')}_${formData.get('module')}`,
            questions: questions
        };

        fetch("/api/create-quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => alert(data.message))
        .catch(error => alert("Error: Could not create quiz."));
    });
</script>
{% endblock %}
