{% extends "base.html" %}
{% block title %}Manage Users{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Manage Users</h2>
    <form id="manage-users-form" class="mb-4">
        <div class="mb-3">
            <label for="user_id" class="form-label">User ID</label>
            <input type="text" id="user_id" name="user_id" class="form-control" required>
        </div>
        <div class="mb-3">
            <label for="role" class="form-label">Role</label>
            <select id="role" name="role" class="form-control">
                <option value="Admin">Admin</option>
                <option value="Instructor">Instructor</option>
                <option value="Student">Student</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="class_val" class="form-label">Grant Access to Class</label>
            <input type="text" id="class_val" name="class_val" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Update User</button>
    </form>
</div>

<script>
    document.getElementById("manage-users-form").addEventListener("submit", function(event) {
        event.preventDefault();

        const formData = new FormData(this);
        const jsonData = Object.fromEntries(formData.entries());

        fetch("/api/manage-user", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => alert(data.message))
        .catch(error => alert("Error: Could not manage user."));
    });
</script>
{% endblock %}
