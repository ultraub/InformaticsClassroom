{% extends "base.html" %}
{% block title %}Modify Quiz{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Modify Quiz</h2>

    <!-- Only two selects: Class and Module -->
    <form id="quiz-selection-form" class="mb-4">
        <!-- 1) Class Selection -->
        <div class="form-group mb-3">
            <label for="class-select" class="form-label">Select Class</label>
            <select id="class-select" class="form-control" required>
                <option value="" selected disabled>Select a class</option>
            </select>
        </div>

        <!-- 2) Module Selection -->
        <div class="form-group mb-3">
            <label for="module-select" class="form-label">Select Module</label>
            <select id="module-select" class="form-control" required>
                <option value="" selected disabled>Select a module</option>
            </select>
        </div>

        <button type="button" id="load-quiz-btn" class="btn btn-secondary">Load Quiz</button>
    </form>

    <div id="questions-container" class="d-none mb-4">
        <h3>Questions</h3>
        <button type="button" id="add-question-btn" class="btn btn-success mb-3">Add Question</button>
        <div id="questions-list">
            <!-- Questions will be dynamically loaded here -->
        </div>
        <button type="button" id="update-quiz-btn" class="btn btn-primary">Update Quiz</button>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function () {
    let questionCount = 0;

    //----------------------------------------------------------------------
    // 1) Get ALL quizzes from /api/view-quizzes, extract distinct classes
    //----------------------------------------------------------------------
    fetch("/api/view-quizzes")
        .then(response => response.json())
        .then(data => {
            if (!data.quizzes) {
                console.error("No quizzes returned by /api/view-quizzes");
                return;
            }
            // Extract distinct classes
            const classSet = new Set();
            data.quizzes.forEach(q => {
                if (q.class) {
                    classSet.add(q.class);
                }
            });

            // Populate class dropdown
            const classSelect = document.getElementById("class-select");
            classSet.forEach(cls => {
                const option = document.createElement("option");
                option.value = cls;
                option.textContent = cls;
                classSelect.appendChild(option);
            });
        })
        .catch(error => {
            console.error("Error loading quizzes:", error);
            alert("Error loading quizzes: " + error);
        });

    //----------------------------------------------------------------------
    // 2) When user selects Class, fetch modules => /api/get-modules?class_name
    //----------------------------------------------------------------------
    const classSelect = document.getElementById("class-select");
    const moduleSelect = document.getElementById("module-select");

    classSelect.addEventListener("change", function () {
        const classVal = this.value;

        // Reset module dropdown and hide questions container
        moduleSelect.innerHTML = "<option value='' selected disabled>Select a module</option>";
        document.getElementById("questions-container").classList.add("d-none");

        if (!classVal) return;

        fetch(`/api/get-modules?class_name=${encodeURIComponent(classVal)}`)
            .then(response => response.json())
            .then(data => {
                if (!data.modules) {
                    console.error("No modules returned for class =", classVal);
                    return;
                }
                // Populate module dropdown
                data.modules.forEach(m => {
                    // Convert to string to ensure safe text
                    const option = document.createElement("option");
                    option.value = m;  // could be numeric or string
                    option.textContent = `Module ${m}`;
                    moduleSelect.appendChild(option);
                });
            })
            .catch(error => {
                console.error("Error loading modules:", error);
                alert("Error loading modules: " + error);
            });
    });

    //----------------------------------------------------------------------
    // 3) Load quiz content => combine class + module into quizId
    //----------------------------------------------------------------------
    document.getElementById("load-quiz-btn").addEventListener("click", function () {
        const classVal = classSelect.value;
        const moduleVal = moduleSelect.value;

        if (!classVal || !moduleVal) {
            alert("Please select both Class and Module first.");
            return;
        }

        // e.g. quizId = "pmap_3"
        const quizId = `${classVal}_${moduleVal}`;

        // GET /api/get-quiz-content-modify?quiz_id=quizId
        fetch(`/api/get-quiz-content-modify?quiz_id=${encodeURIComponent(quizId)}`)
            .then(response => response.json())
            .then(data => {
                if (!data.questions) {
                    alert("No questions found for this quiz.");
                    return;
                }
                questionCount = data.questions.length;

                const questionsContainer = document.getElementById("questions-container");
                const questionsList = document.getElementById("questions-list");
                questionsContainer.classList.remove("d-none");
                questionsList.innerHTML = "";

                data.questions.forEach((question, index) => {
                    questionsList.appendChild(createQuestionElement(question, index + 1));
                });
            })
            .catch(error => alert("Error loading quiz content: " + error));
    });

    //----------------------------------------------------------------------
    // 4) Add a new question
    //----------------------------------------------------------------------
    document.getElementById("add-question-btn").addEventListener("click", function () {
        questionCount++;
        const questionsList = document.getElementById("questions-list");
        questionsList.appendChild(createQuestionElement({ correct_answer: "", open: false }, questionCount));
        renumberQuestions();
    });

    // Helper: Create question element
    function createQuestionElement(question, questionNum) {
        const questionDiv = document.createElement("div");
        questionDiv.className = "question mb-3 p-3 border rounded";
        questionDiv.dataset.questionNum = questionNum;

        questionDiv.innerHTML = `
            <h5>Question ${questionNum}</h5>
            <div class="row mb-2">
                <div class="col-md-8">
                    <input 
                        type="text" 
                        class="form-control answer-input" 
                        placeholder="Correct Answer" 
                        value="${question.correct_answer || ""}"
                    >
                </div>
                <div class="col-md-4 d-flex align-items-center">
                    <div class="form-check">
                        <input 
                            type="checkbox" 
                            class="form-check-input open-input"
                            ${question.open ? "checked" : ""}
                        >
                        <label class="form-check-label">Open-Ended</label>
                    </div>
                    <button 
                        type="button" 
                        class="btn btn-danger ms-3 remove-question-btn"
                    >
                        Remove
                    </button>
                </div>
            </div>
        `;

        // Remove question on click
        questionDiv.querySelector(".remove-question-btn").addEventListener("click", () => {
            questionDiv.remove();
            renumberQuestions();
        });

        return questionDiv;
    }

    // Helper: Renumber the questions after adding/removing
    function renumberQuestions() {
        const questions = document.querySelectorAll("#questions-list .question");
        questions.forEach((question, index) => {
            question.dataset.questionNum = index + 1;
            question.querySelector("h5").textContent = `Question ${index + 1}`;
        });
    }

    //----------------------------------------------------------------------
    // 5) Update quiz => /api/modify-quiz
    //----------------------------------------------------------------------
    document.getElementById("update-quiz-btn").addEventListener("click", function () {
        const classVal = classSelect.value;
        const moduleVal = moduleSelect.value;
        if (!classVal || !moduleVal) {
            alert("Please select both Class and Module before updating.");
            return;
        }

        // e.g. quizId = "pmap_3"
        const quizId = `${classVal}_${moduleVal}`;

        // Gather updated questions
        const questions = [];
        document.querySelectorAll("#questions-list .question").forEach((question, index) => {
            const correctAnswer = question.querySelector(".answer-input").value.trim();
            const open = question.querySelector(".open-input").checked;
            questions.push({
                question_num: index + 1,
                correct_answer: correctAnswer,
                open: open
            });
        });

        fetch("/api/modify-quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                quiz_id: quizId,
                questions: questions
            })
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    alert("Quiz updated successfully.");
                } else {
                    alert("Failed to update quiz." + (data.message ? ` (${data.message})` : ""));
                }
            })
            .catch(error => alert("Error updating quiz: " + error));
    });
});
</script>
{% endblock %}
