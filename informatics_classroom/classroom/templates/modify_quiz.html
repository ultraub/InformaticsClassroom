{% extends "base.html" %}
{% block title %}Modify Quiz{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Modify Quiz</h2>
    <form id="modify-quiz-form" method="POST">
        <div class="mb-3">
            <label for="quiz_id" class="form-label">Quiz ID</label>
            <input type="text" id="quiz_id" name="quiz_id" class="form-control" required>
        </div>
        <button type="button" id="load-quiz-btn" class="btn btn-secondary mb-3">Load Quiz</button>
        <div id="questions-container" class="mb-3">
            <h4>Questions</h4>
        </div>
        <button type="submit" class="btn btn-primary">Modify Quiz</button>
    </form>
</div>

<script>
    const questionsContainer = document.getElementById("questions-container");
    const loadQuizBtn = document.getElementById("load-quiz-btn");

    loadQuizBtn.addEventListener("click", () => {
        const quizId = document.getElementById("quiz_id").value;

        fetch(`/api/get-quiz/${quizId}`)
        .then(response => response.json())
        .then(data => {
            if (data.questions) {
                questionsContainer.innerHTML = "";
                data.questions.forEach((q, index) => {
                    const questionDiv = document.createElement("div");
                    questionDiv.className = "question mb-3";
                    questionDiv.innerHTML = `
                        <label for="question_${index}" class="form-label">Question ${index + 1}</label>
                        <textarea id="question_${index}" name="questions[${index}][text]" class="form-control" rows="2" required>${q.text}</textarea>
                        <label for="answer_${index}" class="form-label">Correct Answer</label>
                        <input type="text" id="answer_${index}" name="questions[${index}][correct_answer]" class="form-control" value="${q.correct_answer}" required>
                    `;
                    questionsContainer.appendChild(questionDiv);
                });
            } else {
                alert("Quiz not found.");
            }
        });
    });

    document.getElementById("modify-quiz-form").addEventListener("submit", function(event) {
        event.preventDefault();
        const formData = new FormData(this);
        const jsonData = Object.fromEntries(formData.entries());

        fetch("/api/modify-quiz", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(jsonData)
        })
        .then(response => response.json())
        .then(data => alert(data.message))
        .catch(error => alert("Error: Could not modify quiz."));
    });
</script>
{% endblock %}
