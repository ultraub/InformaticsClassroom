{% extends "base.html" %}
{% block title %}Create Quiz{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Exercise Review</h2>
    <div id="loading-spinner" class="text-center mt-4">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>
    <div id="classes-container">
        <!-- Classes and progress bars will be dynamically loaded here -->
    </div>
</div>


<script>
    document.addEventListener("DOMContentLoaded", function () {
        const container = document.getElementById("classes-container");
        const spinner = document.getElementById("loading-spinner");
    
        // Show loading spinner
        spinner.style.display = "block";
    
        fetch("/api/exercise-review")
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }
                return response.json();
            })
            .then(classes => {
                spinner.style.display = "none"; // Hide spinner after data loads
    
                if (!Array.isArray(classes)) {
                    throw new TypeError("Expected an array but got: " + typeof classes);
                }
    
                if (classes.length === 0) {
                    container.innerHTML = "<p>You do not have access to any classes.</p>";
                    return;
                }
    
                classes.forEach(classData => {
                    // Create class section
                    const classDiv = document.createElement("div");
                    classDiv.className = "class-section mb-4 p-3 border rounded";
    
                    classDiv.innerHTML = `
                        <h3>${classData.class}</h3>
                        <div class="mb-3">
                            <strong>Overall Progress:</strong>
                            <div class="progress">
                                <div class="progress-bar bg-success" role="progressbar" style="width: ${classData.overall_progress}%;" 
                                    aria-valuenow="${classData.overall_progress}" aria-valuemin="0" aria-valuemax="100">
                                    ${classData.overall_progress}%
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <strong>Overall Correctness:</strong>
                            <div class="progress">
                                <div class="progress-bar bg-primary" role="progressbar" style="width: ${classData.overall_correctness}%;" 
                                    aria-valuenow="${classData.overall_correctness}" aria-valuemin="0" aria-valuemax="100">
                                    ${classData.overall_correctness}%
                                </div>
                            </div>
                        </div>
                        <button class="btn btn-secondary view-modules-btn" data-class="${classData.class}">
                            View Modules
                        </button>
                        <div class="modules-container d-none mt-3"></div>
                    `;
    
                    container.appendChild(classDiv);
    
                    // Add event listener for viewing modules
                    classDiv.querySelector(".view-modules-btn").addEventListener("click", function () {
                        const modulesContainer = classDiv.querySelector(".modules-container");
                        if (modulesContainer.classList.contains("d-none")) {
                            modulesContainer.innerHTML = "";
    
                            // Sort modules by module number before rendering
                            const sortedModules = [...classData.modules].sort((a, b) => a.module - b.module);
    
                            sortedModules.forEach(module => {
                                const moduleDiv = document.createElement("div");
                                moduleDiv.className = "module-section mb-2";
    
                                moduleDiv.innerHTML = `
                                    <h5>Module ${module.module}</h5>
                                    <div class="mb-1">
                                        <strong>Progress:</strong>
                                        <div class="progress">
                                            <div class="progress-bar bg-success" role="progressbar" style="width: ${module.module_progress}%;" 
                                                aria-valuenow="${module.module_progress}" aria-valuemin="0" aria-valuemax="100">
                                                ${module.module_progress}%
                                            </div>
                                        </div>
                                    </div>
                                    <div>
                                        <strong>Correctness:</strong>
                                        <div class="progress">
                                            <div class="progress-bar bg-primary" role="progressbar" style="width: ${module.module_correctness}%;" 
                                                aria-valuenow="${module.module_correctness}" aria-valuemin="0" aria-valuemax="100">
                                                ${module.module_correctness}%
                                            </div>
                                        </div>
                                    </div>
                                `;
    
                                modulesContainer.appendChild(moduleDiv);
                            });
    
                            modulesContainer.classList.remove("d-none");
                            this.textContent = "Hide Modules";
                        } else {
                            modulesContainer.classList.add("d-none");
                            this.textContent = "View Modules";
                        }
                    });
                });
            })
            .catch(error => {
                spinner.style.display = "none"; // Hide spinner on error
                container.innerHTML = `<p class="text-danger">Error loading exercise review data: ${error.message}</p>`;
            });
    });
    
</script>
{% endblock %}
