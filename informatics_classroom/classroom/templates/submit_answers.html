{% extends "base.html" %}
{% block title %}Submit Answers{% endblock %}
{% block content %}
<div class="container mt-4">
    <h2>Submit Answers</h2>
    <form id="token-form" class="mb-4">
        <div class="form-group">
            <label for="token" class="form-label">Enter Token</label>
            <input type="text" id="token" name="token" class="form-control" required>
        </div>
        <button type="button" id="load-quiz-btn" class="btn btn-secondary">Load Quiz</button>
    </form>

    <div id="questions-container" class="mb-4 d-none">
        <!-- Questions will be dynamically loaded here -->
    </div>
    <div id="summary-container" class="mt-4">
        <!-- Overall feedback will be displayed here -->
    </div>
</div>

<script>
    document.getElementById("load-quiz-btn").addEventListener("click", function () {
        const token = document.getElementById("token").value;

        if (!token) {
            alert("Token is required to load the quiz.");
            return;
        }

        fetch(`/api/get-quiz?token=${token}`)
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    alert(data.message);
                } else {
                    const questionsContainer = document.getElementById("questions-container");
                    questionsContainer.classList.remove("d-none");
                    questionsContainer.innerHTML = "";
                    data.questions.forEach(question => {
                        const questionDiv = document.createElement("div");
                        questionDiv.className = "question mb-3";
                        questionDiv.innerHTML = `
                            <label for="question_${question.question_num}" class="form-label">
                                Question ${question.question_num}
                            </label>
                            <div class="input-group">
                                <input type="text" class="form-control answer-input" id="question_${question.question_num}" 
                                       name="answer" required>
                                <button type="button" class="btn btn-primary submit-answer-btn" data-question="${question.question_num}">
                                    Submit
                                </button>
                            </div>
                            <small class="feedback text-muted" id="feedback_${question.question_num}"></small>
                        `;
                        questionsContainer.appendChild(questionDiv);
                    });

                    document.querySelectorAll(".submit-answer-btn").forEach(button => {
                        button.addEventListener("click", function () {
                            const questionNum = this.dataset.question;
                            const answerInput = document.getElementById(`question_${questionNum}`);
                            const answer = answerInput.value.trim();
                            const feedbackElement = document.getElementById(`feedback_${questionNum}`);

                            if (!answer) {
                                feedbackElement.textContent = "Answer is required.";
                                feedbackElement.className = "text-danger";
                                return;
                            }

                            fetch("/submit-answer", {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/x-www-form-urlencoded"
                                },
                                body: new URLSearchParams({
                                    token: token,
                                    team: "{{ session['user'].get('preferred_username') }}",
                                    question_num: questionNum,
                                    answer_num: answer
                                })
                            })
                                .then(response => response.json())
                                .then(data => {
                                    if (data.correct) {
                                        answerInput.classList.add("is-valid");
                                        answerInput.classList.remove("is-invalid");
                                        feedbackElement.textContent = "Correct!";
                                        feedbackElement.className = "text-success";
                                    } else {
                                        answerInput.classList.add("is-invalid");
                                        answerInput.classList.remove("is-valid");
                                        feedbackElement.textContent = "Incorrect.";
                                        feedbackElement.className = "text-danger";
                                    }
                                })
                                .catch(error => {
                                    feedbackElement.textContent = "Error submitting answer.";
                                    feedbackElement.className = "text-danger";
                                });
                        });
                    });
                }
            })
            .catch(error => {
                alert("Error loading quiz: " + error);
            });
    });
</script>
{% endblock %}
